name: hp_card_game
description: A multiplayer card game built with Flutter and Firebase.

publish_to: 'none'

version: 1.0.15+15

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  firebase_database: ^12.0.2
  provider: ^6.1.2

  cupertino_icons: ^1.0.6
  flutter_lints: ^6.0.0
  firebase_app_check: ^0.4.1
  video_player: ^2.9.2
  collection: ^1.19.1
  share_plus: ^13.3.0
  firebase_crashlytics: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - lib/images/
    - lib/images/avatars/
    - lib/vids/What_is_Hood_Politix.mp4
    - lib/vids/